<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
<style>
text{font-family:Arial,sans-serif;font-size:14px}
.actor{fill:#fff;stroke:#000;stroke-width:2}
.life{stroke:#777;stroke-dasharray:6,4}
.msg{stroke:#000;stroke-width:2;marker-end:url(#arrow)}
.ret{stroke:#000;stroke-width:1;stroke-dasharray:5,5;marker-end:url(#arrow)}
.box{fill:#eaeaea;stroke:#000}
.loop{fill:none;stroke:#000;stroke-width:2}
</style>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
<path d="M0,0 L0,6 L9,3 z" fill="black"/>
</marker>
</defs>

<!-- Participants -->
<rect class="actor" x="40" y="20" width="80" height="40"/><text x="65" y="45">Main</text>
<rect class="actor" x="220" y="20" width="120" height="40"/><text x="240" y="45">m:MoteurGraphique</text>
<rect class="actor" x="470" y="20" width="140" height="40"/><text x="490" y="45">:InterfaceGraphique</text>
<rect class="actor" x="720" y="20" width="120" height="40"/><text x="745" y="45">cont:Controleur</text>
<rect class="actor" x="970" y="20" width="130" height="40"/><text x="995" y="45">jeu:JeuPerso</text>
<rect class="actor" x="1220" y="20" width="130" height="40"/><text x="1240" y="45">panel:PanelDessin</text>
<rect class="actor" x="1480" y="20" width="150" height="40"/><text x="1505" y="45">dessin:DessinPerso</text>

<!-- Lifelines -->
<line class="life" x1="80" y1="60" x2="80" y2="1040"/>
<line class="life" x1="280" y1="60" x2="280" y2="1040"/>
<line class="life" x1="540" y1="60" x2="540" y2="1040"/>
<line class="life" x1="780" y1="60" x2="780" y2="1040"/>
<line class="life" x1="1035" y1="60" x2="1035" y2="1040"/>
<line class="life" x1="1285" y1="60" x2="1285" y2="1040"/>
<line class="life" x1="1555" y1="60" x2="1555" y2="1040"/>

<!-- Init -->
<line class="msg" x1="80" y1="100" x2="280" y2="100"/>
<text x="120" y="92">MoteurGraphique(jeu,dessin)</text>

<line class="msg" x1="80" y1="140" x2="280" y2="140"/>
<text x="145" y="132">lancerJeu(800,600)</text>

<rect class="box" x="270" y="150" width="20" height="820"/>

<line class="msg" x1="280" y1="190" x2="540" y2="190"/>
<text x="360" y="182">InterfaceGraphique(dessin)</text>

<rect class="box" x="530" y="200" width="20" height="160"/>

<line class="msg" x1="540" y1="240" x2="780" y2="240"/>
<text x="625" y="232">Controleur()</text>

<line class="msg" x1="540" y1="280" x2="1285" y2="280"/>
<text x="820" y="272">PanelDessin(dessin)</text>

<line class="msg" x1="280" y1="320" x2="540" y2="320"/>
<text x="380" y="312">getControleur()</text>

<line class="ret" x1="540" y1="350" x2="280" y2="350"/>
<text x="400" y="342">cont</text>

<!-- Loop -->
<rect class="loop" x="210" y="400" width="1450" height="520"/>
<text x="225" y="425">loop [non jeu.etreFini()]</text>

<line class="msg" x1="280" y1="470" x2="780" y2="470"/>
<text x="470" y="462">getCommande()</text>
<rect class="box" x="770" y="480" width="20" height="60"/>
<line class="ret" x1="780" y1="540" x2="280" y2="540"/>
<text x="500" y="532">commande</text>

<line class="msg" x1="280" y1="600" x2="1035" y2="600"/>
<text x="600" y="592">evoluer(commande)</text>
<rect class="box" x="1025" y="610" width="20" height="60"/>
<line class="ret" x1="1035" y1="670" x2="280" y2="670"/>

<line class="msg" x1="280" y1="730" x2="540" y2="730"/>
<text x="380" y="722">dessiner()</text>

<line class="msg" x1="540" y1="770" x2="1285" y2="770"/>
<text x="860" y="762">dessinerJeu()</text>
<rect class="box" x="1275" y="780" width="20" height="120"/>

<line class="msg" x1="1285" y1="820" x2="1555" y2="820"/>
<text x="1370" y="812">dessiner(imageSuivante)</text>
<rect class="box" x="1545" y="830" width="20" height="60"/>

<line class="ret" x1="1555" y1="890" x2="1285" y2="890"/>

<line class="msg" x1="1285" y1="930" x2="1285" y2="930"/>
<text x="1300" y="925">repaint()</text>

<line class="ret" x1="1285" y1="960" x2="540" y2="960"/>
<line class="ret" x1="540" y1="990" x2="280" y2="990"/>

</svg>