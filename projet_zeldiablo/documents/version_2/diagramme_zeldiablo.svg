<text class="txt small" x="515" y="135">+evoluer(Commande) : void</text>
<text class="txt small" x="515" y="160">+etreFini() : boolean</text>

<rect class="cls" x="500" y="300" width="420" height="160"/>
<text class="txt" x="650" y="330">DessinZeldiablo</text>
<line x1="500" y1="345" x2="920" y2="345" stroke="black"/>
<text class="txt small" x="515" y="370">+DessinZeldiablo(JeuZeldiablo)</text>
<text class="txt small" x="515" y="395">+dessiner(BufferedImage) : void</text>

<rect class="cls" x="1040" y="60" width="260" height="120"/>
<text class="txt" x="1130" y="90">Labyrinthe</text>
<line x1="1040" y1="105" x2="1300" y2="105" stroke="black"/>
<text class="txt small" x="1055" y="130">-murs : boolean[][]</text>
<text class="txt small" x="1055" y="155">+Labyrinthe()</text>

<rect class="cls" x="1040" y="300" width="260" height="140"/>
<text class="txt" x="1150" y="330">Heros</text>
<line x1="1040" y1="345" x2="1300" y2="345" stroke="black"/>
<text class="txt small" x="1055" y="370">-x : int</text>
<text class="txt small" x="1055" y="395">-y : int</text>
<text class="txt small" x="1055" y="420">+deplacer(String) : void</text>

<!-- Relations -->
<line x1="340" y1="130" x2="500" y2="130" stroke="black" stroke-dasharray="8,4"/>
<text class="rel" x="395" y="115">implements</text>

<line x1="340" y1="380" x2="500" y2="380" stroke="black" stroke-dasharray="8,4"/>
<text class="rel" x="395" y="365">implements</text>

<line x1="860" y1="120" x2="1040" y2="120" stroke="black" marker-end="url(#arrow)"/>
<text class="rel" x="900" y="105">1  labyrinthe</text>

<line x1="860" y1="170" x2="1040" y2="340" stroke="black" marker-end="url(#arrow)"/>
