<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<style>
.cls{fill:white;stroke:black;stroke-width:2}
.txt{font-family:Arial,sans-serif;font-size:16px}
.small{font-size:14px}
.rel{font-size:14px;font-style:italic}
</style>

<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="black"/>
  </marker>
</defs>

<!-- Interfaces -->
<rect class="cls" x="60" y="60" width="280" height="140"/>
<text class="txt" x="170" y="85">&lt;&lt;interface&gt;&gt;</text>
<line x1="60" y1="100" x2="340" y2="100" stroke="black"/>
<text class="txt" x="180" y="125">Jeu</text>
<line x1="60" y1="140" x2="340" y2="140" stroke="black"/>
<text class="txt small" x="75" y="165">+evoluer(Commande) : void</text>
<text class="txt small" x="75" y="185">+etreFini() : boolean</text>

<rect class="cls" x="60" y="320" width="280" height="120"/>
<text class="txt" x="170" y="345">&lt;&lt;interface&gt;&gt;</text>
<line x1="60" y1="360" x2="340" y2="360" stroke="black"/>
<text class="txt" x="160" y="385">DessinJeu</text>
<line x1="60" y1="400" x2="340" y2="400" stroke="black"/>
<text class="txt small" x="75" y="425">+dessiner(BufferedImage) : void</text>

<!-- Classes -->
<rect class="cls" x="500" y="40" width="360" height="180"/>
<text class="txt" x="620" y="70">JeuZeldiablo</text>
